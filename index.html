<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>My Daily Word</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>My Daily Word</h1>
      <p class="tag">Learn one clear, readable word each day</p>
    </header>

    <section class="card" aria-live="polite">
      <div class="illustration" role="img" aria-label="Decorative illustration">
        <!-- Inline SVG fallback for highest readability -->
        <img src="/assets/illustration.svg" alt="Decorative illustration" />
      </div>

      <div class="word-area">
        <div class="word" id="word">—</div>
        <div class="pos" id="pos"></div>
        <div class="definition" id="definition"></div>
        <div class="example" id="example"></div>
      </div>

      <div class="controls">
        <button id="prev" aria-label="Previous day">◀</button>
        <button id="today" class="primary">Today</button>
        <button id="next" aria-label="Next day">▶</button>
      </div>
    </section>

    <footer>
      <p>Offline-ready • Responsive • Readable image</p>
    </footer>
  </main>

  <script src="/js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.error);
    }
  </script>
</body>
</html>
